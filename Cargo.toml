[workspace]
resolver = "3"
members = [
    "crates/hy-core",
    "crates/hy-pet",
    "crates/hy-server",
    "crates/hy-sim",
    "apps/companion/src-tauri",
]
# The companion is a Windows product (Tauri 2 + WebView2). It is built and
# tested by the Windows CI job; the Linux job excludes it (see .github/workflows/ci.yml).
default-members = ["crates/hy-core", "crates/hy-pet", "crates/hy-server", "crates/hy-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false
repository = "https://github.com/accounts-NKlodha/CA-health-advisor"

[workspace.dependencies]
hy-core = { path = "crates/hy-core" }
hy-pet = { path = "crates/hy-pet" }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
proptest = "1.12.0"
tempfile = "3.27.0"
# V1-5 pairing and sync (docs/V1-5_Pairing_Security.md section 15). Each version is the
# newest patch of its minor version that was at least 14 days old when V1-5 started.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "form", "query"] }
data-encoding = "2.11.1"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
subtle = "2.6.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tower = { version = "0.5.3", default-features = false, features = ["util", "limit", "timeout"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
zeroize = { version = "1.9.1", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
