[package]
name = "hy-companion"
description = "HealthierYou desktop companion (Tauri 2 + fixed WebView2): pet shell, tray, keyboard panel, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[build-dependencies]
# Versions proven by feasibility batch 1 (spike/batch1, build 6ef6eb3).
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
chrono.workspace = true
getrandom.workspace = true
# `link`: the pinned TLS client and pairing flow (slice V1-5a).
hy-core = { workspace = true, features = ["link"] }
hy-pet.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.4", features = ["tray-icon"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# Already in the lockfile through Tauri. Used only by src/win32.rs.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids unsafe code. The companion needs a few Win32 calls (the proven
# non-activating pet window, show without activation, display-change and hotkey messages,
# handing focus back, the tracker's signals: input idle time, lock and unlock, sleep and
# wake, presentation and full-screen state, user-scope DPAPI for the server token, and the
# V1-6 update file dialog, installer launch and Run value). They live in src/win32.rs only, each with
# a SAFETY note, so here unsafe code is denied (not forbidden) and that one module allows
# it.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
