[package]
name = "hy-server"
description = "HealthierYou office LAN server: pinned TLS 1.3, pairing, device tokens, admin page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
hy-core.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# Already in the lockfile through the companion. Used only by src/dpapi.rs and
# src/acl.rs (reading the data folder's rights back, V1-6b).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }
# Running as a Windows service under its virtual account (V1-5 contract 6.2, slice
# V1-6b). Uses the same windows-sys 0.61; adds only widestring. Used only by
# src/winservice.rs (the binary).
windows-service = "0.8.1"

[dev-dependencies]
hy-core = { workspace = true, features = ["link"] }
proptest.workspace = true
reqwest.workspace = true
# TLS 1.2 only so a test client can prove the server refuses it (T-P5).
rustls = { workspace = true, features = ["tls12"] }
tempfile.workspace = true

# The workspace forbids unsafe code. The server's key files are protected with
# machine-scope DPAPI (V1-5 contract 6.2), which needs two Win32 calls. They live in
# src/dpapi.rs only, each with a SAFETY note, so here unsafe code is denied (not
# forbidden) and that one module allows it; so does the Windows part of src/acl.rs.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
