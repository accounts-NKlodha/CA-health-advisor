[package]
name = "hy-core"
description = "HealthierYou shared core: schema, local store, migrations, clock and time zone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# The companion's and simulator's pinned-TLS client for the office server (V1-5,
# `hy_core::link`). The server itself needs only the protocol types, so it leaves this off.
link = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
aws-lc-rs.workspace = true
chrono-tz.workspace = true
chrono.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, optional = true }
rusqlite.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
