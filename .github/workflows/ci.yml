# HealthierYou CI (slices V1-0 to V1-4 and V1-5a, and their integration).
# Linux: format, lint and unit tests for the shared core, the pet shell logic (hy-pet:
# placement and clamping, pet packs, edits), the office server (V1-5a: the real server
# over loopback TLS 1.3 against the companion's pinned client, T-P and T-S tests) and
# simulator, plus the companion UI type check and build. The companion is a Windows product (Tauri 2 +
# WebView2), so it is linted, tested and built on the Windows job, modelled on the
# batch 1 feasibility workflow (spike/batch1). V1-6: the Windows job builds three real
# per-user installers (A, B, and C whose bundled runtime is broken) with the Microsoft
# fixed WebView2 runtime, signs them with keys made for the run, installs A, and runs
# scripts/windows/Test-CompanionLifecycle.ps1: update A to B, C rolled back to B, refused
# files, the downloaded-file mark, rollback to A, and uninstall with no registry residue.
# V1-6b: it builds four server installers (S4 is a test release that changes the database
# then fails) and runs scripts/windows/Test-ServerLifecycle.ps1 as administrator over a
# data folder seeded by hy-sim: the service under its virtual account, the exact data
# folder rights (over a folder opened to Users), the firewall rule, signature and version
# checked upgrades, the data kept bound to its mirror, verified copies before an upgrade,
# rollback of the program and of the database, an incomplete rollback that keeps
# everything, and uninstall keeping or deleting the data, then a fresh install.
# Between install and lifecycle it runs the installed companion's scripted self-test
# (HY_SELFTEST) on the runner's desktop: real pet window styles, placement at every size, Bring pet above
# clock, tray hide and show, presentation hiding, bubble layout and the panel hotkey, then
# the coaching engine end to end on a simulated clock (a due reminder as the single bubble,
# the answer recorded in the store, a presentation hiding it with nothing replayed).
# V1-7 (soak and network capture; the real runs are on office PCs, docs/V1_Acceptance.md):
# the Windows job runs the soak's shortened variants with accelerated clocks. The installed
# companion runs 72 simulated office hours in 12 minutes (reminders answered on the real
# bubble, lock, sleep, windows opened and closed; cadence and store bounds checked by the
# app) and hy-sim runs the real server with 10 simulated companions over 30 simulated days;
# scripts/windows/Test-Soak.ps1 samples each process tree and fails on a growth trend in
# memory, handles or threads. The Linux job feeds the companion's real TLS traffic
# (T-S23 on the wire, crates/hy-server/tests/capture.rs) to the capture script's analyser,
# and both scripts' analysis self-tests run under PowerShell 7 (Linux) and Windows
# PowerShell 5.1 (Windows), the versions office PCs have.
# Office test kit (scripts/windows/kit): its self-test runs on both jobs, and the Windows
# job packs the tested installers with the kit as the artifact office-test-kit.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  rust-linux:
    name: Rust (Linux) - fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --exclude hy-companion --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude hy-companion --locked

      # V1-7: the capture analyser on genuine companion traffic (the real client and server
      # through a recording relay, written as pcapng), a negative control (text that is in
      # clear in every ClientHello must be found), and the analysers' self-tests.
      - name: Network capture analyser (T-S23 on the wire) and soak analysis self-tests
        run: |
          pcap="$RUNNER_TEMP/t-s23.pcapng"
          HY_CAPTURE_PCAP="$pcap" cargo test -p hy-server --test capture --locked
          pwsh -NoProfile -File scripts/windows/Test-NetworkCapture.ps1 -SelfTest
          pwsh -NoProfile -File scripts/windows/Test-NetworkCapture.ps1 -Analyze "$pcap" -ServerIp 192.168.50.10 -Canary CANARY_LABEL_5b1e,CANARY_ALIAS_7f3a
          # Exit 1 is FAIL (2 would be INCONCLUSIVE, 0 PASS): it must find the ALPN text.
          rc=0; pwsh -NoProfile -File scripts/windows/Test-NetworkCapture.ps1 -Analyze "$pcap" -ServerIp 192.168.50.10 -Canary hy/1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the analyser did not FAIL on the ALPN name, which is in clear in every ClientHello (exit $rc)"; exit 1
          fi
          pwsh -NoProfile -File scripts/windows/Test-Soak.ps1 -SelfTest
          pwsh -NoProfile -File scripts/windows/Test-HealthierYou-Camera.ps1 -SelfTest
          pwsh -NoProfile -File scripts/windows/Test-CameraSoak.ps1 -SelfTest
          # The office test kit: step order, resume, administrator jobs, verdicts, zip and redaction.
          pwsh -NoProfile -File scripts/windows/kit/Invoke-OfficeTestKit.ps1 -SelfTest

  ui:
    name: Companion UI - type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/companion/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/companion/ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows - clippy, tests, companion build
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/companion/ui/package-lock.json

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Build the companion UI (the Tauri build embeds it)
        working-directory: apps/companion/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Clippy, whole workspace (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests, whole workspace
        run: cargo test --workspace --locked

      # V1-6: the real installers. The bundled fixed WebView2 runtime comes from Microsoft
      # (its signature is checked); the update-signing keys are made for this run only and
      # thrown away with the runner, so these builds can never update a real install.
      - name: Fetch the fixed WebView2 runtime (Microsoft-signed)
        run: |
          $info = Join-Path $env:RUNNER_TEMP 'webview2-fixed.txt'
          ./scripts/windows/Get-WebView2FixedRuntime.ps1 -Destination apps/companion/src-tauri/webview2-fixed -InfoFile $info
          Get-Content $info

      - name: Update-signing keys for this run only
        working-directory: apps/companion
        run: |
          $k = Join-Path $env:RUNNER_TEMP 'hy-keys'
          New-Item -ItemType Directory -Force $k | Out-Null
          $tauri = 'ui/node_modules/@tauri-apps/cli/tauri.js'
          node $tauri signer generate --ci -p ci-run -w "$k/key1"
          if ($LASTEXITCODE -ne 0) { throw 'key 1 failed' }
          node $tauri signer generate --ci -p ci-run -w "$k/key2"
          if ($LASTEXITCODE -ne 0) { throw 'key 2 failed' }
          # The companion builds with key 1 as its only trusted key (build.rs).
          $pub = (Get-Content -Raw "$k/key1.pub").Trim()
          "HY_UPDATE_PUBKEY=$pub" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build and sign installers A, B and C (C cannot start, to test rollback)
        working-directory: apps/companion
        run: |
          $tauri = 'ui/node_modules/@tauri-apps/cli/tauri.js'
          $k = Join-Path $env:RUNNER_TEMP 'hy-keys'
          $out = Join-Path $env:RUNNER_TEMP 'hy-installers'
          $other = Join-Path $env:RUNNER_TEMP 'hy-other-key'
          New-Item -ItemType Directory -Force $out, $other | Out-Null
          $installerConfig = (Resolve-Path src-tauri/tauri.installer.json).Path
          function Build-Installer([string]$v) {
            $cfg = Join-Path $env:RUNNER_TEMP "version-$v.json"
            "{ `"version`": `"$v`" }" | Set-Content -Encoding utf8NoBOM $cfg
            node $tauri build --config $installerConfig --config $cfg
            if ($LASTEXITCODE -ne 0) { throw "Building $v failed" }
            $name = "HealthierYou_${v}_x64-setup.exe"
            Copy-Item "../../target/release/bundle/nsis/$name" $out
            node $tauri signer sign -f "$k/key1" -p ci-run --app-version $v (Join-Path $out $name)
            if ($LASTEXITCODE -ne 0) { throw "Signing $v failed" }
            $f = Get-Item (Join-Path $out $name)
            "$name size_mb=$([math]::Round($f.Length / 1MB, 1)) sha256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)"
          }
          Build-Installer '0.1.0'
          Build-Installer '0.1.1'
          # C: a fake runtime in place of the real one, so the new version never shows
          # its window and never confirms its start.
          $real = Join-Path $env:RUNNER_TEMP 'webview2-real'
          Move-Item src-tauri/webview2-fixed $real
          New-Item -ItemType Directory src-tauri/webview2-fixed | Out-Null
          Set-Content src-tauri/webview2-fixed/msedgewebview2.exe 'not a runtime'
          Build-Installer '0.1.2'
          Remove-Item -Recurse -Force src-tauri/webview2-fixed
          Move-Item $real src-tauri/webview2-fixed
          # A copy of A signed with a key the companion does not trust.
          Copy-Item (Join-Path $out 'HealthierYou_0.1.0_x64-setup.exe') $other
          node $tauri signer sign -f "$k/key2" -p ci-run --app-version 0.1.0 (Join-Path $other 'HealthierYou_0.1.0_x64-setup.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Signing with key 2 failed' }
          # Keep the bundle folder out of the build cache.
          Remove-Item -Recurse -Force ../../target/release/bundle

      - name: Install A per user (no admin rights used) and check it
        timeout-minutes: 10
        run: ./scripts/windows/Test-CompanionLifecycle.ps1 -Phase Install -Installers (Join-Path $env:RUNNER_TEMP 'hy-installers') -Work (Join-Path $env:RUNNER_TEMP 'hy-lifecycle')

      - name: Pet shell self-test of the installed app (idle memory sampled, informational; camera on a synthetic device)
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'hy-selftest.json'
          $env:HY_SELFTEST = $report
          $env:HY_SELFTEST_IDLE_S = '20'
          # The installed app must use the bundled runtime, not the runner's WebView2.
          $env:HY_SELFTEST_EXPECT_FIXED_RUNTIME = '1'
          $p = Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'HealthierYou\hy-companion.exe') -PassThru
          $null = $p.Handle  # keep the handle so the exit code is readable
          function Get-Tree([int]$root) {
            $all = Get-CimInstance Win32_Process
            $ids = @($root); $added = $true
            while ($added) {
              $added = $false
              foreach ($proc in $all) {
                if ($ids -contains $proc.ParentProcessId -and -not ($ids -contains $proc.ProcessId)) {
                  $ids += $proc.ProcessId; $added = $true
                }
              }
            }
            $all | Where-Object { $ids -contains $_.ProcessId }
          }
          $installDir = Join-Path $env:LOCALAPPDATA 'HealthierYou\webview2-fixed\'
          $bundledSeen = $false; $otherSeen = $false
          $deadline = (Get-Date).AddMinutes(9)
          $samples = @()
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $tree = @(Get-Tree $p.Id)
            if ($tree.Count -gt 0) {
              $ws = [math]::Round((($tree | Measure-Object WorkingSetSize -Sum).Sum) / 1MB, 1)
              $priv = [math]::Round((($tree | Measure-Object PrivatePageCount -Sum).Sum) / 1MB, 1)
              $samples += [pscustomobject]@{ t = (Get-Date).ToString('HH:mm:ss'); processes = $tree.Count; working_set_mb = $ws; private_mb = $priv }
              foreach ($w in @($tree | Where-Object { $_.Name -eq 'msedgewebview2.exe' -and $_.ExecutablePath })) {
                if ($w.ExecutablePath.StartsWith($installDir, [StringComparison]::OrdinalIgnoreCase)) { $bundledSeen = $true } else { $otherSeen = $true }
              }
            }
          }
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
            '::error title=Self-test::The self-test did not finish within 9 minutes'
            throw 'The self-test did not finish within 9 minutes'
          }
          $p.WaitForExit()
          "Process tree memory (A7 target: idle at most 150 MB; informational on a CI runner):"
          $samples | Format-Table -AutoSize | Out-String -Width 200
          if (Test-Path $report) {
            Get-Content $report
            # Annotations are readable from the checks API when the job log is not: each
            # failed required check as an error, and the camera's measurements as notices.
            $json = Get-Content $report -Raw | ConvertFrom-Json
            foreach ($c in $json.checks) {
              $line = "$($c.name): $($c.detail)" -replace '[\r\n]+', ' '
              if ($c.required -and -not $c.ok) { "::error title=Self-test check failed::$line" }
              elseif ($c.name -like 'camera_*') { "::notice title=Self-test camera::$(if ($c.ok) { 'ok' } else { 'NOT OK (informational)' }) $line" }
            }
          } else { 'No self-test report was written' }
          "WebView2 processes from the bundled runtime: $bundledSeen; from elsewhere: $otherSeen"
          "self-test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Pet shell self-test failed (exit code $($p.ExitCode))" }
          if (-not $bundledSeen -or $otherSeen) { throw 'The installed app did not run on its bundled WebView2 runtime only' }

      # V1-7: the soak's CI variant on the installed app (accelerated clock, see the header).
      - name: Accelerated soak of the installed app (72 simulated hours in 12 minutes)
        timeout-minutes: 40
        run: |
          ./scripts/windows/Test-Soak.ps1 -CiSelfTest -Minutes 12 -Report (Join-Path $env:RUNNER_TEMP 'hy-soak\soak-companion.txt')

      # V2-5: the camera soak's CI variant on the installed app (synthetic camera; the
      # real 2-hour soak with a real webcam is on the office PC, docs/V2_Soak.md).
      - name: Accelerated camera soak of the installed app (synthetic camera, 10 minutes)
        timeout-minutes: 40
        run: |
          ./scripts/windows/Test-CameraSoak.ps1 -CiSelfTest -Minutes 10 -Report (Join-Path $env:RUNNER_TEMP 'hy-soak\soak-camera.txt')

      - name: Soak and capture analysis self-tests under Windows PowerShell 5.1
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/Test-Soak.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Test-Soak.ps1 -SelfTest failed under Windows PowerShell 5.1' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/Test-NetworkCapture.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Test-NetworkCapture.ps1 -SelfTest failed under Windows PowerShell 5.1' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/Test-HealthierYou-Camera.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Test-HealthierYou-Camera.ps1 -SelfTest failed under Windows PowerShell 5.1' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/Test-CameraSoak.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Test-CameraSoak.ps1 -SelfTest failed under Windows PowerShell 5.1' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/kit/Invoke-OfficeTestKit.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Invoke-OfficeTestKit.ps1 -SelfTest failed under Windows PowerShell 5.1' }

      - name: Update, rollback, refusals and uninstall of the installed app
        timeout-minutes: 25
        run: ./scripts/windows/Test-CompanionLifecycle.ps1 -Phase Lifecycle -Installers (Join-Path $env:RUNNER_TEMP 'hy-installers') -OtherKeyDir (Join-Path $env:RUNNER_TEMP 'hy-other-key') -Work (Join-Path $env:RUNNER_TEMP 'hy-lifecycle')

      # V1-6b: the office server's per-machine installer and Windows service.
      - name: Build and sign server installers S1 to S4 (S3 cannot start, S4 changes the database then fails)
        run: |
          cargo build --release --locked -p hy-server -p hy-sim
          $k = Join-Path $env:RUNNER_TEMP 'hy-keys'
          $out = Join-Path $env:RUNNER_TEMP 'hy-server-installers'
          $other = Join-Path $env:RUNNER_TEMP 'hy-server-other-key'
          $bin = Join-Path $env:RUNNER_TEMP 'hy-server-bin'
          New-Item -ItemType Directory -Force $out, $other, $bin | Out-Null
          Copy-Item target/release/hy-server.exe (Join-Path $bin 'hy-server.exe')
          Copy-Item target/release/hy-sim.exe (Join-Path $bin 'hy-sim.exe')
          # The S4 test release: the real server built with the CI-only hook that applies
          # a Contract migration older servers refuse, then fails to start.
          $env:HY_SERVER_TEST_SCHEMA_CHANGE_THEN_FAIL = '1'
          cargo build --release --locked -p hy-server
          if ($LASTEXITCODE -ne 0) { throw 'Building the S4 test server failed' }
          Remove-Item Env:HY_SERVER_TEST_SCHEMA_CHANGE_THEN_FAIL
          Copy-Item target/release/hy-server.exe (Join-Path $bin 'hy-server-schema-then-fail.exe')
          $tauri = 'apps/companion/ui/node_modules/@tauri-apps/cli/tauri.js'
          $bad = Join-Path $env:RUNNER_TEMP 'not-a-server.exe'
          Set-Content $bad 'not a program'
          function Build-Server([string]$v, [string]$exe, [string]$dir, [string]$key) {
            ./scripts/windows/Build-ServerInstaller.ps1 -Version $v -ServerExe $exe -OutDir $dir
            node $tauri signer sign -f "$k/$key" -p ci-run --app-version $v (Join-Path $dir "HealthierYou-Server_${v}_x64-setup.exe")
            if ($LASTEXITCODE -ne 0) { throw "Signing server $v failed" }
          }
          $real = Join-Path $bin 'hy-server.exe'
          Build-Server '0.1.0' $real $out key1
          Build-Server '0.1.1' $real $out key1
          Build-Server '0.1.2' $bad $out key1
          Build-Server '0.1.3' (Join-Path $bin 'hy-server-schema-then-fail.exe') $out key1
          Build-Server '0.1.1' $real $other key2

      # V1-7: the soak's CI variant for the server (accelerated clock, see the header).
      - name: Accelerated server soak (hy-sim, 30 simulated days in 8 minutes)
        timeout-minutes: 25
        run: ./scripts/windows/Test-Soak.ps1 -Role Server -Sim (Join-Path $env:RUNNER_TEMP 'hy-server-bin\hy-sim.exe') -Minutes 8 -SimDays 30 -Report (Join-Path $env:RUNNER_TEMP 'hy-soak\soak-server.txt')

      - name: Server install, service, upgrade, rollback and uninstall (administrator)
        timeout-minutes: 35
        run: |
          # The control-log mirror must be on another volume than the data folder (C:).
          $sys = $env:SystemDrive.TrimEnd(':')
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -ne $sys -and $_.Free -gt 1GB } | Select-Object -First 1
          if (-not $drive) { throw 'No second volume on this runner for the mirror' }
          ./scripts/windows/Test-ServerLifecycle.ps1 -Installers (Join-Path $env:RUNNER_TEMP 'hy-server-installers') -OtherKeyDir (Join-Path $env:RUNNER_TEMP 'hy-server-other-key') -Mirror "$($drive.Root)hy-server-mirror" -Work (Join-Path $env:RUNNER_TEMP 'hy-lifecycle') -Sim (Join-Path $env:RUNNER_TEMP 'hy-server-bin\hy-sim.exe')

      - name: Keep installers A and S1 and the lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-ci
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/hy-server-installers/HealthierYou-Server_0.1.0_x64-setup.exe
            ${{ runner.temp }}/hy-server-installers/HealthierYou-Server_0.1.0_x64-setup.exe.sig
            ${{ runner.temp }}/hy-installers/HealthierYou_0.1.0_x64-setup.exe
            ${{ runner.temp }}/hy-installers/HealthierYou_0.1.0_x64-setup.exe.sig
            ${{ runner.temp }}/hy-lifecycle/*.csv
            ${{ runner.temp }}/hy-soak/*
            ${{ runner.temp }}/webview2-fixed.txt

      # The office test kit (scripts/windows/kit/README.md): the companion installers A and B
      # and server installer S1 exactly as built and tested above (CI test builds: no
      # Authenticode signature; update keys made for this run only, A trusts B's key so the
      # owner can try the update from file), the kit's launchers and orchestrator, the test
      # scripts it calls, and a manifest with each installer's SHA-256. The kit's self-test
      # and both roles' dry runs run from the assembled folder under Windows PowerShell 5.1.
      # GitHub serves the artifact as office-test-kit.zip, holding HealthierYou-office-test-kit/.
      - name: Assemble the office test kit
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'office-test-kit\HealthierYou-office-test-kit'
          $inst = Join-Path $kit 'installers'
          New-Item -ItemType Directory -Force $inst, (Join-Path $kit 'scripts') | Out-Null
          Copy-Item scripts/windows/kit/* $kit
          foreach ($s in 'Test-HealthierYou-OfficePC.ps1', 'Test-Soak.ps1', 'Test-NetworkCapture.ps1', 'Test-CameraSoak.ps1', 'Test-HealthierYou-Camera.ps1') {
            Copy-Item (Join-Path 'scripts/windows' $s) (Join-Path $kit 'scripts')
          }
          $companion = 'HealthierYou_0.1.0_x64-setup.exe'
          $newer = 'HealthierYou_0.1.1_x64-setup.exe'
          $server = 'HealthierYou-Server_0.1.0_x64-setup.exe'
          foreach ($f in @((Join-Path $env:RUNNER_TEMP "hy-installers\$companion"), (Join-Path $env:RUNNER_TEMP "hy-installers\$newer"), (Join-Path $env:RUNNER_TEMP "hy-server-installers\$server"))) {
            if (-not (Test-Path $f) -or -not (Test-Path "$f.sig")) { throw "missing installer or signature: $f" }
            Copy-Item $f, "$f.sig" $inst
          }
          $sha = [ordered]@{}
          # The installers and the scripts the administrator window stages: it refuses any that differ.
          foreach ($f in @(Get-ChildItem $inst -Filter *.exe) + @(Get-ChildItem (Join-Path $kit 'scripts') -Filter *.ps1) | Sort-Object Name) { $sha[$f.Name] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash }
          $commit = '${{ github.event.pull_request.head.sha || github.sha }}'
          [ordered]@{
            commit = $commit.Substring(0, 12); run_id = '${{ github.run_id }}'; built_utc = (Get-Date).ToUniversalTime().ToString('o')
            companion = $companion; companion_newer = $newer; server = $server; sha256 = $sha
            note = 'CI test builds: no Authenticode signature; update keys made for this CI run only'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $kit 'kit-manifest.json')
          Get-Content (Join-Path $kit 'kit-manifest.json')
          $orch = Join-Path $kit 'Invoke-OfficeTestKit.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $orch -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'the kit self-test failed from the assembled folder' }
          foreach ($role in 'Server', 'Camera') {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $orch -Role $role -DryRun
            if ($LASTEXITCODE -ne 0) { throw "the kit dry run ($role) failed from the assembled folder" }
          }
          Get-ChildItem -Recurse $kit | Select-Object @{ n = 'file'; e = { $_.FullName.Substring($kit.Length + 1) } }, Length | Format-Table -AutoSize | Out-String -Width 200

      - name: Upload the office test kit
        uses: actions/upload-artifact@v4
        with:
          name: office-test-kit
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/office-test-kit/

      # The server's first start on Windows: keys sealed with machine-scope DPAPI, then
      # loaded back (V1-5a). Then the load simulator (V1-5b): the real server in process
      # with 10 simulated companions over a simulated week, a backup and a restore.
      - name: Server init and fingerprint (real DPAPI), load simulator
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'hy-server-data'
          cargo run --locked -q -p hy-server -- --version
