# Builds the disposable batch 1 feasibility app. Runs only on branch spike/batch1.
name: spike-batch1

on:
  push:
    branches: [spike/batch1]
    paths: ['spikes/batch1/**', '.github/workflows/spike-batch1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/batch1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor MediaPipe pose lite (Apache-2.0)
        run: |
          npm pack @mediapipe/tasks-vision@1.1.1 --silent
          tar xzf mediapipe-tasks-vision-1.1.1.tgz
          New-Item -ItemType Directory -Force ui/vendor/wasm | Out-Null
          Copy-Item package/vision_bundle.mjs ui/vendor/
          Copy-Item package/wasm/* ui/vendor/wasm/
          Invoke-WebRequest -UseBasicParsing https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task -OutFile ui/vendor/pose_landmarker_lite.task
          Get-ChildItem -Recurse ui/vendor | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Fetch the official fixed-version WebView2 runtime (x64 cab)
        run: |
          $page = (Invoke-WebRequest -UseBasicParsing https://developer.microsoft.com/en-us/microsoft-edge/webview2/).Content
          # Links sit in the page's embedded JSON with escaped slashes
          $page = $page -replace '\\u002F', '/'
          $urls = [regex]::Matches($page, 'https://[^"''\s<>]+?FixedVersionRuntime\.[0-9.]+\.x64\.cab') | ForEach-Object Value | Select-Object -Unique
          if (-not $urls) {
            Write-Host "No fixed runtime link found. Page excerpt:"
            ($page -split "`n" | Select-String -Pattern 'Fixed|cab' | Select-Object -First 20) | ForEach-Object { Write-Host $_ }
            exit 1
          }
          $versions = $urls | ForEach-Object { [pscustomobject]@{ Url = $_; Ver = [version]([regex]::Match($_, 'FixedVersionRuntime\.([0-9.]+)\.x64').Groups[1].Value) } }
          $pick = $versions | Sort-Object Ver -Descending | Select-Object -First 1
          Write-Host "Using $($pick.Url)"
          Invoke-WebRequest -UseBasicParsing $pick.Url -OutFile wv2.cab
          $sig = Get-AuthenticodeSignature wv2.cab
          Write-Host "cab signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'cab is not validly signed by Microsoft' }
          New-Item -ItemType Directory -Force wv2tmp | Out-Null
          expand.exe wv2.cab -F:* wv2tmp | Out-Null
          $inner = Get-ChildItem wv2tmp -Directory | Select-Object -First 1
          if (Test-Path src-tauri/webview2-fixed) { Remove-Item -Recurse -Force src-tauri/webview2-fixed }
          Move-Item $inner.FullName src-tauri/webview2-fixed
          if (-not (Test-Path src-tauri/webview2-fixed/msedgewebview2.exe)) { throw 'msedgewebview2.exe missing from extracted runtime' }
          "webview2_fixed_url=$($pick.Url)" | Out-File -Append BUILD-INFO.txt
          "webview2_fixed_version=$($pick.Ver)" | Out-File -Append BUILD-INFO.txt
          "webview2_cab_signer=$($sig.SignerCertificate.Subject)" | Out-File -Append BUILD-INFO.txt

      - name: Build per-user NSIS installer
        env:
          HY_BUILD_COMMIT: ${{ github.sha }}
        run: |
          "commit=$env:HY_BUILD_COMMIT" | Out-File -Append BUILD-INFO.txt
          "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Out-File -Append BUILD-INFO.txt
          npx --yes @tauri-apps/cli@2.12.3 build
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "installer=$($exe.Name) size_mb=$([math]::Round($exe.Length / 1MB, 1))" | Out-File -Append BUILD-INFO.txt
          "installer_sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Out-File -Append BUILD-INFO.txt
          Copy-Item README.md, BUILD-INFO.txt src-tauri/target/release/bundle/nsis/
          Get-Content BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HY-Spike-batch1-${{ github.sha }}
          path: |
            spikes/batch1/src-tauri/target/release/bundle/nsis/*.exe
            spikes/batch1/src-tauri/target/release/bundle/nsis/README.md
            spikes/batch1/src-tauri/target/release/bundle/nsis/BUILD-INFO.txt
          retention-days: 30
