# cargo-deny policy (tracked work W3, architecture 9, V1-5 contract C18).
# CI runs `cargo deny --locked check` on every pull request (job "Supply chain").
# The licence register (docs/Licence_Register.md) lists what this policy allows and why.
# Any exception below carries its reason; review them when a dependency changes.

[graph]
# The products ship on Windows (x86_64). Linux is checked too, because CI builds and
# tests the shared crates there; the Linux-only GTK stack under Tauri is never shipped.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# The RustSec advisory database. Vulnerabilities, unsound crates and yanked versions fail
# the check; unmaintained crates fail too unless ignored here with a reason.
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 (unmaintained, no vulnerability) is a build-time proc macro of glib-macros and gtk3-macros, the GTK stack Tauri uses on Linux only. The companion ships on Windows (WebView2), where it is not in the graph; nothing of it reaches a shipped binary." },
]

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft, used unmodified; see the register).
# No GPL or LGPL-only crate is allowed: r-efi offers MIT or Apache-2.0, which apply.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# The workspace's own crates are proprietary (license = "UNLICENSED", publish = false).
ignore = true
registries = []

[bans]
# Tauri pulls several majors of a few crates (syn, toml, windows-sys...): reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # TLS is rustls with aws-lc-rs and a pinned certificate (V1-5 contract 5): no OpenSSL
    # or platform TLS stack may come in through a dependency.
    { name = "openssl", reason = "TLS is rustls only (V1-5 contract 5)" },
    { name = "openssl-sys", reason = "TLS is rustls only (V1-5 contract 5)" },
    { name = "native-tls", reason = "TLS is rustls only (V1-5 contract 5)" },
]
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
